<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Cost Simulator</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(160deg, #0f172a, #1f2937);
            color: #f8fafc;
        }
        .container {
            max-width: 760px;
            margin: 50px auto;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
        }
        h1 { margin-top: 0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }
        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #f8fafc;
            color: #0f172a;
        }
        button {
            background: #dc2626;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }
        button:hover { background: #b91c1c; }
        .result {
            margin-top: 16px;
            padding: 14px;
            background: #111827;
            border-left: 5px solid #ef4444;
            border-radius: 8px;
            min-height: 52px;
        }
        .link-row {
            margin-top: 18px;
        }
        .link-row a { color: #93c5fd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Response Cost Simulator</h1>
        <p>Estimate total job cost using square footage, service type, and urgency level.</p>

        <div class="grid">
            <div>
                <label for="sqft">Square Footage</label>
                <input type="number" id="sqft" min="1" placeholder="e.g. 1200">
            </div>
            <div>
                <label for="serviceType">Service Type</label>
                <select id="serviceType">
                    <option value="4">Water Mitigation ($4 / sqft)</option>
                    <option value="7">Fire Restoration ($7 / sqft)</option>
                    <option value="15">Mold Remediation ($15 / sqft)</option>
                </select>
            </div>
            <div>
                <label for="urgency">Urgency Multiplier</label>
                <select id="urgency">
                    <option value="1">Standard (x1.0)</option>
                    <option value="1.15">Priority (x1.15)</option>
                    <option value="1.3">Emergency 24/7 (x1.3)</option>
                </select>
            </div>
        </div>

        <button id="estimateBtn">Calculate Estimate</button>
        <div class="result" id="result">Enter values and click calculate.</div>

        <div class="link-row">
            <a href="scratch.html">Back to Scratch Page</a> |
            <a href="index.html">Back to Professional Site</a>
        </div>
    </div>

    <script>
        function formatMoney(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                maximumFractionDigits: 0
            }).format(value);
        }

        function calculateCost() {
            const sqft = Number(document.getElementById('sqft').value);
            const rate = Number(document.getElementById('serviceType').value);
            const urgency = Number(document.getElementById('urgency').value);
            const result = document.getElementById('result');

            if (!sqft || sqft <= 0) {
                result.textContent = 'Please enter a valid square footage greater than 0.';
                return;
            }

            const baseCost = sqft * rate;
            const totalCost = Math.round(baseCost * urgency);
            const laborWindow = Math.max(1, Math.ceil(sqft / 500));

            result.textContent =
                'Estimated total: ' + formatMoney(totalCost) +
                ' (Base: ' + formatMoney(baseCost) +
                ', Urgency: x' + urgency.toFixed(2) +
                ', Estimated labor window: ' + laborWindow + ' day(s)).';
        }

        document.getElementById('estimateBtn').addEventListener('click', calculateCost);
    </script>
</body>
</html>
